name: Paper Trail 讨论
description: 围绕一组相关论文交流，持续补充文章与想法。
title: "[Paper Trail] 主题名称"
body:
  - type: input
    id: cluster
    attributes:
      label: Paper Trail 页面
      description: 粘贴仓库中对应 Paper Trail Markdown 页面的链接。
      placeholder: https://github.com/你的账号/仓库名/blob/main/clusters/trail-name.md
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: 起点论文 P0
      description: 填写标题和论文链接。
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 这群文章共同关心的问题
      placeholder: 一两句话即可，也可以先留空，之后慢慢补充。
  - type: markdown
    attributes:
      value: |
        后续想法直接写在本 Issue 的评论区，可标注“整体想法”或“关于 P2”。
        新文章可以先在评论里推荐，再整理进 Paper Trail 页面。
        提交后，请把本 Issue 链接填回 Paper Trail 页面的“Paper Trail 评论区”。
